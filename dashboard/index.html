<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENI·Sienna — Plataforma</title>
<style>
  :root { --acc:#4169e2; --ok:#1a7f37; --err:#b42318; --run:#b54708;
          --bg:#f6f7f9; --card:#ffffff; --txt:#1f2328; --mut:#656d76; --bd:#d9dee3; }
  * { box-sizing:border-box; margin:0; }
  body { font:14px/1.5 system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--card); border-bottom:1px solid var(--bd); padding:14px 28px;
           display:flex; align-items:baseline; gap:16px; }
  header h1 { font-size:18px; } header .sub { color:var(--mut); font-size:13px; }
  nav { display:flex; gap:4px; padding:10px 28px 0; }
  nav button { border:1px solid var(--bd); border-bottom:none; background:#eceff2;
               padding:8px 18px; border-radius:8px 8px 0 0; cursor:pointer; font-size:14px; }
  nav button.act { background:var(--card); font-weight:600; color:var(--acc); }
  main { padding:18px 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:14px 16px; }
  .card h3 { font-size:15px; margin-bottom:2px; }
  .card .d { color:var(--mut); font-size:12.5px; min-height:34px; }
  .fila { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .badge { font-size:12px; padding:2px 10px; border-radius:999px; border:1px solid var(--bd); color:var(--mut); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.error { color:var(--err); border-color:var(--err); }
  .badge.corriendo { color:var(--run); border-color:var(--run); }
  .badge.corriendo::before { content:"● "; animation:pulso 1.2s infinite; }
  @keyframes pulso { 50% { opacity:.3; } }
  button.run { background:var(--acc); color:#fff; border:none; padding:6px 16px;
               border-radius:7px; cursor:pointer; font-size:13px; }
  button.run:disabled { background:#a8b3d8; cursor:default; }
  button.sec { background:none; border:1px solid var(--bd); padding:5px 12px;
               border-radius:7px; cursor:pointer; font-size:12.5px; color:var(--mut); }
  pre.log { background:#0e1116; color:#c9d1d9; border-radius:8px; padding:12px;
            font:12px/1.45 Consolas,monospace; max-height:320px; overflow:auto;
            margin-top:10px; white-space:pre-wrap; }
  .figs { display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:14px; }
  .figs img { width:100%; border:1px solid var(--bd); border-radius:8px; background:#fff; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; background:var(--card); }
  th,td { border:1px solid var(--bd); padding:4px 9px; text-align:right; white-space:nowrap; }
  th { background:#eef1f4; position:sticky; top:0; }
  td:first-child, th:first-child { text-align:left; }
  .scroll { overflow:auto; max-height:420px; border-radius:8px; border:1px solid var(--bd); }
  select { padding:6px 10px; border:1px solid var(--bd); border-radius:7px; font-size:13px; }
  .doc { background:var(--card); border:1px solid var(--bd); border-radius:10px;
         padding:22px 28px; max-width:960px; }
  .doc h1{font-size:20px;margin:14px 0 8px} .doc h2{font-size:17px;margin:14px 0 6px}
  .doc h3{font-size:15px;margin:10px 0 4px} .doc p{margin:6px 0} .doc li{margin-left:22px}
  .doc table{margin:8px 0} .doc code{background:#eef1f4;padding:1px 5px;border-radius:4px;font-size:12.5px}
  h2.sec { font-size:15px; color:var(--mut); margin:18px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>SENI·Sienna</h1>
  <span class="sub">Recreación del SENI en Sienna/NREL — corridas, resultados y reporte</span>
</header>
<nav>
  <button id="t-corridas" class="act" onclick="tab('corridas')">Corridas</button>
  <button id="t-resultados" onclick="tab('resultados')">Resultados</button>
  <button id="t-reporte" onclick="tab('reporte')">Reporte</button>
</nav>
<main>
  <section id="p-corridas"><div class="grid" id="corridas"></div>
    <h2 class="sec">Log de la corrida seleccionada</h2>
    <div class="fila" style="justify-content:flex-start;gap:10px">
      <select id="logsel" onchange="verLog()"></select>
      <button class="sec" onclick="verLog()">Actualizar</button>
    </div>
    <pre class="log" id="log">(selecciona una corrida)</pre>
  </section>
  <section id="p-resultados" style="display:none">
    <h2 class="sec">Figuras</h2><div class="figs" id="figs"></div>
    <h2 class="sec">Tablas de validación</h2>
    <div class="fila" style="justify-content:flex-start;gap:10px">
      <select id="csvsel" onchange="verTabla()"></select>
    </div>
    <div class="scroll" style="margin-top:10px"><table id="tabla"></table></div>
  </section>
  <section id="p-reporte" style="display:none">
    <div class="fila" style="justify-content:flex-start;gap:10px;margin-bottom:10px">
      <select id="docsel" onchange="verDoc()"></select>
    </div>
    <div class="doc" id="doc">…</div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
function tab(t){
  for (const x of ['corridas','resultados','reporte']){
    $('p-'+x).style.display = x===t?'':'none';
    $('t-'+x).classList.toggle('act', x===t);
  }
  if (t==='resultados') cargarResultados();
  if (t==='reporte') cargarDocs();
}
async function refrescar(){
  const cs = await (await fetch('/api/corridas')).json();
  const sel = $('logsel'); const cur = sel.value;
  sel.innerHTML = cs.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('');
  if (cur) sel.value = cur;
  $('corridas').innerHTML = cs.map(c=>`
    <div class="card"><h3>${c.nombre}</h3><div class="d">${c.desc}</div>
      <div class="fila">
        <span class="badge ${c.estado==='ok'?'ok':c.estado==='error'?'error':c.estado==='corriendo'?'corriendo':''}">${c.estado}</span>
        <span style="color:var(--mut);font-size:11.5px">${c.script}</span>
        <button class="run" ${c.estado==='corriendo'?'disabled':''}
          onclick="lanzar('${c.id}')">Ejecutar</button>
      </div></div>`).join('');
}
async function lanzar(id){
  await fetch('/api/corridas/'+id, {method:'POST'});
  $('logsel').value = id; refrescar(); setTimeout(verLog, 800);
}
async function verLog(){
  const id = $('logsel').value; if (!id) return;
  const r = await (await fetch('/api/log/'+id)).json();
  const el = $('log'); el.textContent = r.texto || '(log vacío aún)';
  el.scrollTop = el.scrollHeight;
}
async function cargarResultados(){
  const r = await (await fetch('/api/resultados')).json();
  $('figs').innerHTML = r.figuras.map(f=>`<figure><img src="/figuras/${f}" alt="${f}">
    <figcaption style="color:var(--mut);font-size:12px;padding:4px 2px">${f}</figcaption></figure>`).join('');
  $('csvsel').innerHTML = r.tablas.map(t=>`<option>${t}</option>`).join('');
  if (r.tablas.length) verTabla();
}
async function verTabla(){
  const n = $('csvsel').value; if (!n) return;
  const r = await (await fetch('/api/tabla/'+encodeURIComponent(n))).json();
  $('tabla').innerHTML = '<tr>'+r.columnas.map(c=>`<th>${c}</th>`).join('')+'</tr>'
    + r.filas.map(f=>'<tr>'+f.map(v=>`<td>${v}</td>`).join('')+'</tr>').join('');
}
async function cargarDocs(){
  const r = await (await fetch('/api/resultados')).json();
  const pref = 'REPORTE_SENI_SIENNA.md';
  const docs = [...r.docs.filter(d=>d===pref), ...r.docs.filter(d=>d!==pref)];
  $('docsel').innerHTML = docs.map(d=>`<option>${d}</option>`).join('');
  if (docs.length) verDoc();
}
function md2html(s){
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const lineas = s.split('\n'); let out=[]; let enTabla=false;
  for (let ln of lineas){
    if (/^\|/.test(ln)){
      if (/^\|[\s\-|:]+\|$/.test(ln.trim())) continue;
      const celdas = ln.split('|').slice(1,-1).map(c=>c.trim());
      if (!enTabla){ out.push('<table>'); enTabla=true;
        out.push('<tr>'+celdas.map(c=>'<th>'+c+'</th>').join('')+'</tr>'); }
      else out.push('<tr>'+celdas.map(c=>'<td>'+c+'</td>').join('')+'</tr>');
      continue;
    } else if (enTabla){ out.push('</table>'); enTabla=false; }
    ln = ln.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
           .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1');
    if (/^### /.test(ln)) out.push('<h3>'+ln.slice(4)+'</h3>');
    else if (/^## /.test(ln)) out.push('<h2>'+ln.slice(3)+'</h2>');
    else if (/^# /.test(ln)) out.push('<h1>'+ln.slice(2)+'</h1>');
    else if (/^- /.test(ln)) out.push('<li>'+ln.slice(2)+'</li>');
    else if (/^> /.test(ln)) out.push('<p style="color:var(--mut);border-left:3px solid var(--bd);padding-left:10px">'+ln.slice(2)+'</p>');
    else if (ln.trim()==='---') out.push('<hr>');
    else if (ln.trim()==='') out.push('');
    else out.push('<p>'+ln+'</p>');
  }
  if (enTabla) out.push('</table>');
  return out.join('\n');
}
async function verDoc(){
  const n = $('docsel').value; if (!n) return;
  const r = await (await fetch('/api/doc/'+encodeURIComponent(n))).json();
  $('doc').innerHTML = md2html(r.texto);
}
refrescar(); setInterval(refrescar, 3000); setInterval(verLog, 3000);
</script>
</body>
</html>
